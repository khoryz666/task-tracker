name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository
# activity. This trivial monthly commit resets that clock so the reminder
# workflow keeps running indefinitely with no manual attention.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch keepalive marker
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git diff --cached --quiet || git commit -m "chore: keepalive"
          git push
